name: 'Runenv - Secret Scanner'
description: 'A lightning-fast, zero-dependency engine that proactively fails your CI/CD build if hardcoded secrets are detected.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  dir:
    description: 'Directory to scan (default: .)'
    required: false
    default: '.'
  no-entropy:
    description: 'Disable Shannon entropy scanning for faster execution but lower accuracy (default: false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run env-doctor
      shell: bash
      env:
        CI: true
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_NO_ENTROPY: ${{ inputs.no-entropy }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        ARGS=()
        if [ "${INPUT_NO_ENTROPY}" = "true" ]; then
          ARGS+=("--no-entropy")
        fi

        # We execute the bundled application statically from the action path
        node "${ACTION_PATH}/dist/index.js" -d "${INPUT_DIR}" "${ARGS[@]}"
